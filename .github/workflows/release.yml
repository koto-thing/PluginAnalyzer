name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$MANUAL_VERSION"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must match vMAJOR.MINOR.PATCH."
            exit 1
          fi
          project_version="$(sed -n '/project(PluginAnalyzer/,/)/s/.*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "${version#v}" != "$project_version" ]]; then
            echo "::error::Tag $version does not match CMake project version $project_version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-universal
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ladspa-sdk libasound2-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            ninja-build xvfb

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build-release -A x64
          -DBUILD_TESTING=ON
          -DPLUGIN_ANALYZER_ENABLE_STRESS_TESTS=ON

      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: >
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DPLUGIN_ANALYZER_ENABLE_STRESS_TESTS=ON

      - name: Configure universal macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64" \
            -DBUILD_TESTING=ON \
            -DPLUGIN_ANALYZER_ENABLE_STRESS_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build-release --config Release

      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Test under virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: >
          xvfb-run -a ctest --test-dir build-release
          -C Release --output-on-failure

      - name: Install
        shell: bash
        run: >
          cmake --install build-release --prefix staging
          --config Release
          --component PluginAnalyzerApp

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            if ($env:REQUIRE_SIGNING -eq "true") {
              throw "Windows signing certificate is required."
            }
            Write-Warning "Creating an unsigned Windows draft package."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "signtool.exe was not found."
          }
          & $signTool.FullName sign /fd SHA256 `
            /f $certificate /p $env:CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 `
            staging\bin\PluginAnalyzer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed."
          }
          Remove-Item -LiteralPath $certificate -Force

      - name: Sign and notarize macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            if [[ "$REQUIRE_SIGNING" == "true" ]]; then
              echo "::error::macOS signing certificate is required."
              exit 1
            fi
            echo "::warning::Creating an unsigned macOS draft package."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          certificate="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k actions "$keychain"
          codesign --deep --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" staging/PluginAnalyzer.app
          ditto -c -k --keepParent staging/PluginAnalyzer.app \
            "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple staging/PluginAnalyzer.app
          rm -f "$certificate"
          security delete-keychain "$keychain"

      - name: Generate SPDX SBOM
        shell: pwsh
        run: >
          ./.github/scripts/Generate-Sbom.ps1
          -Version "${{ needs.prepare.outputs.version }}"
          -Platform "${{ matrix.platform }}"
          -OutputDirectory release

      - name: Create Windows archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "PluginAnalyzer-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip"
          Compress-Archive -Path staging\* -DestinationPath "release\$name"
          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "release\$name.sha256" -Encoding ascii

      - name: Create macOS archive and checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="PluginAnalyzer-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip"
          ditto -c -k --sequesterRsrc --keepParent staging/PluginAnalyzer.app "release/$name"
          (cd release && shasum -a 256 "$name" > "$name.sha256")

      - name: Create Linux archive and checksum
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="PluginAnalyzer-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz"
          tar -C staging -czf "release/$name" .
          (cd release && sha256sum "$name" > "$name.sha256")

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft GitHub Release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          cd release
          sha256sum --check PluginAnalyzer-*-linux-x64.tar.gz.sha256
          sha256sum --check PluginAnalyzer-*-macos-universal.zip.sha256
          sha256sum --check PluginAnalyzer-*-windows-x64.zip.sha256

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
          else
            gh release create "$VERSION" release/* \
              --draft --generate-notes --title "PluginAnalyzer $VERSION" \
              --target "$GITHUB_SHA"
          fi

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Publish approved release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "$VERSION" --draft=false
